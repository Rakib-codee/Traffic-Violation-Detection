# Real camera view: UA-DETRAC sequence MVI_20012 (frame 642 of the original
# sequence, distributed via the CC BY 4.0 Roboflow export in data/vehicles).
# Elevated fixed camera; near carriageway runs toward the camera (+y),
# far carriageway (right, beyond the fence) runs away (-y).
# No traffic signal is visible in this view; signal_roi is null, which
# disables the red-light rule for this camera (wrong-way still applies).
camera_id: detrac-mvi20012
stop_line:
  - {x: 262, y: 480}
  - {x: 500, y: 480}
lanes:
  - name: near-lane-left
    polygon:
      - {x: 262, y: 500}
      - {x: 360, y: 500}
      - {x: 330, y: 60}
      - {x: 290, y: 60}
    direction: {x: 0, y: 1}
  - name: near-lane-right
    polygon:
      - {x: 360, y: 500}
      - {x: 470, y: 500}
      - {x: 390, y: 60}
      - {x: 330, y: 60}
    direction: {x: 0, y: 1}
  - name: far-lane-away
    polygon:
      - {x: 430, y: 30}
      - {x: 490, y: 30}
      - {x: 580, y: 220}
      - {x: 545, y: 260}
    direction: {x: 0, y: -1}
signal_roi: null
red_light_tolerance_s: 0.3
wrong_way_min_frames: 10
