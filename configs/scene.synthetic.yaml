# Scene calibration for the synthetic sample video generated by
# scripts/make_sample_video.py (640x360 @ 10 fps, stop line at y=240, road
# spanning x=180..460 with the lane divider at x=320). Used by `make demo`.
# The synthetic clip contains no traffic signal, so signal_roi is null and the
# red-light rule is disabled for this view (wrong-way still applies).
camera_id: synthetic-intersection
stop_line:
  - {x: 180, y: 240}
  - {x: 460, y: 240}
lanes:
  - name: southbound
    polygon:
      - {x: 180, y: 0}
      - {x: 320, y: 0}
      - {x: 320, y: 360}
      - {x: 180, y: 360}
    direction: {x: 0, y: 1}
  - name: northbound
    polygon:
      - {x: 320, y: 0}
      - {x: 460, y: 0}
      - {x: 460, y: 360}
      - {x: 320, y: 360}
    direction: {x: 0, y: -1}
signal_roi: null
red_light_tolerance_s: 0.3
wrong_way_min_frames: 10
