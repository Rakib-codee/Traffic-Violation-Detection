[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tvd"
version = "0.1.0"
description = "Automatic traffic violation detection from video"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy==2.5.4",
    "opencv-python-headless==5.0.0.93",
    "pydantic==2.14.1",
    "PyYAML==6.0.3",
    "torch==2.14.1",
    "torchvision==0.29.1",
    "ultralytics==8.4.184",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.2",
]
data = [
    "roboflow==1.7.2",
]
track = [
    "trackeval==1.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
